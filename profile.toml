# The only file you need to edit. README.md is generated -- don't edit that.

[profile]
username = "Arham-Begani"
name = ""                       # blank = pull the display name from the API
photo  = "assets/me.jpg"

# Portrait. These are tuned for your avatar -- see SETUP.md before changing them.
portrait_cols     = 140         # grid width; more columns = finer grain
portrait_width    = 460         # rendered width in px
portrait_polarity = "ink"       # dense glyphs where the art is DARK, in both themes
portrait_weight   = 1.6         # >1 keeps the black suit from flooding the frame
portrait_local    = 0.6         # local contrast; separates the face from the backdrop
portrait_vignette = 0.0         # your background is part of the art, so leave it

# The reveal. Cells appear one at a time in a scattered order that still leans
# downward, so there is no wipe edge. 0 = a soft top-down fade, 1 = pure random.
portrait_scatter  = 0.35        # ~38% of the height is mid-dissolve at once
portrait_grain    = 1.0         # noise feature size, in character cells
portrait_duration = 2.2         # seconds, start to last straggler

exclude_langs = ["html", "css", "jupyter notebook"]
colophon = true

# --- rewrite these two lines in your own voice --------------------------------
about = [
  "Python and frontend. I'd rather take on something too big than something too safe.",
  "Right now that's **[Forze](https://forze.in)** — an agentic system that turns a founder's concept into shipped work instead of another to-do list.",
]

stack = [
  "python", "typescript", "javascript", "react", "node",
  "fastapi", "postgres", "docker", "git", "linux",
]

