# Rust subtree b06908ab was already validated in run41867260272: fmt/check/Clippy,
# 18 unit tests, 4 HTTP integration tests, and the 9-case live comparison passed.
# This follow-up changes only the unsupported Cargo Dependabot label; assert the
# identical Rust subtree and rerun full repository guards, strict docs and source checks.
name: ACS audit final guards and docs
on:
  push:
    branches: [oss-validation/acs-187-audit]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: receipts
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GenAI-Security-Project/agent-control-standard
          ref: 208698c09fac0523368793239fed5c0425af204d
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Prepare and verify exact merged candidate without a source commit
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/logs"
          test "$(git rev-parse HEAD)" = 208698c09fac0523368793239fed5c0425af204d
          test -z "$(git status --porcelain)"
          git config user.name 'Validation harness'
          git config user.email 'validation@localhost'
          git fetch --no-tags origin bba1b846fbe7511b0b6f876c61b1fe91b27b07da
          git merge --no-commit --no-ff bba1b846fbe7511b0b6f876c61b1fe91b27b07da
          test "$(git write-tree)" = 8b59ea8b9a6c40ca71449af377c0bf37c5cf4301
          printf '%s  %s\n' '28106f9ff9fe9bd719fba3a0e4d2ebeedefe6035525956e0929aae24afe67202' '../receipts/validation/acs-187-bounded-audit.patch' | sha256sum --check
          git apply --check --index ../receipts/validation/acs-187-bounded-audit.patch
          git apply --index ../receipts/validation/acs-187-bounded-audit.patch
          test "$(git write-tree)" = ead511f87bdeeefbd56089ff9b3d466b6b89ba95
          git diff --exit-code
          git diff --cached --check 8b59ea8b9a6c40ca71449af377c0bf37c5cf4301
          candidate_tree="$(git write-tree)"
          test "$(git rev-parse "$candidate_tree:reference-implementations/agt-rust")" = b06908ab0aa798284d3131967d4a04843ab0fe3b
          git status --short | tee "$GITHUB_WORKSPACE/logs/candidate-source.log"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.9.9'
          github-token: ''
      - name: Install locked guard and documentation dependencies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked 2>&1 | tee "$GITHUB_WORKSPACE/logs/uv-sync.log"
      - name: Repository Python guards
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -v 2>&1 | tee "$GITHUB_WORKSPACE/logs/python-guards.log"
      - name: Strict documentation build
        working-directory: source
        shell: bash
        env:
          GITHUB_PAGES_URL: https://owaspacs.org/docs/
        run: |
          set -euo pipefail
          uv run mkdocs build --strict -d _site/docs 2>&1 | tee "$GITHUB_WORKSPACE/logs/docs-build.log"
      - name: Verify validated source remained unchanged
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 208698c09fac0523368793239fed5c0425af204d
          test "$(git write-tree)" = ead511f87bdeeefbd56089ff9b3d466b6b89ba95
          git diff --exit-code
          git diff --cached --check 8b59ea8b9a6c40ca71449af377c0bf37c5cf4301
          git status --short | tee "$GITHUB_WORKSPACE/logs/final-source.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: acs-audit-final-guards-docs
          path: logs/
