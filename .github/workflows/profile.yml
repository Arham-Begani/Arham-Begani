name: profile

on:
  schedule:
    - cron: "17 6 * * *"     # 06:17 UTC daily. Pick an odd minute; :00 is busy.
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    paths:
      - "profile.toml"
      - "assets/**"
      - "build/**"
      - "generate.py"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Redraw everything
        env:
          # PROFILE_TOKEN is a classic PAT with read:user -- add it as a repo
          # secret if you want private contributions counted. Without it this
          # falls back to the built-in token, which sees public activity only.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python generate.py

      - name: Commit only what changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out README.md
          if git diff --staged --quiet; then
            echo "nothing moved today"
          else
            git commit -m "profile: refresh $(date -u +%F)"
            git push
          fi
