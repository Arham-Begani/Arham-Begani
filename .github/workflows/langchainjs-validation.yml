name: Validate LangChain.js rebase

on:
  push:
    branches: [oss-validation/langchainjs-11955]
    paths: [.github/workflows/langchainjs-validation.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openai:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Arham-Begani/langchainjs
          ref: 694e96efd6ee92efc9cd0b451a05e6904683011c
          fetch-depth: 100
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Record exact source and install locked dependencies
        run: |
          mkdir -p /tmp/langchainjs-results
          git rev-parse HEAD HEAD^{tree} | tee /tmp/langchainjs-results/source.txt
          node --version | tee /tmp/langchainjs-results/node.txt
          pnpm --filter '@langchain/openai...' install --frozen-lockfile 2>&1 | tee /tmp/langchainjs-results/install.log
      - name: Lint and check changed-file formatting
        run: |
          pnpm lint 2>&1 | tee /tmp/langchainjs-results/lint.log
          git diff --name-only -z aecbc7eae0befb6103ef7d90b2c603d94af0e20a HEAD | xargs -0 pnpm exec oxfmt --check 2>&1 | tee /tmp/langchainjs-results/format.log
      - name: Build core and run all OpenAI unit tests
        run: |
          pnpm --filter @langchain/core build 2>&1 | tee /tmp/langchainjs-results/build.log
          pnpm --filter @langchain/openai test 2>&1 | tee /tmp/langchainjs-results/tests.log
          git diff --exit-code
      - name: Compare type-check diagnostics with unchanged upstream
        shell: bash
        run: |
          set +e
          pnpm --filter @langchain/openai exec tsc --noEmit > /tmp/langchainjs-results/types-head.log 2>&1
          head_exit=$?
          set -e
          printf 'head exit: %s\n' "$head_exit" | tee /tmp/langchainjs-results/types-status.txt
          if [ "$head_exit" -eq 0 ]; then exit 0; fi
          git switch --detach aecbc7eae0befb6103ef7d90b2c603d94af0e20a
          set +e
          pnpm --filter @langchain/openai exec tsc --noEmit > /tmp/langchainjs-results/types-base.log 2>&1
          base_exit=$?
          set -e
          printf 'base exit: %s\n' "$base_exit" | tee -a /tmp/langchainjs-results/types-status.txt
          test "$base_exit" = "$head_exit"
          diff -u /tmp/langchainjs-results/types-base.log /tmp/langchainjs-results/types-head.log > /tmp/langchainjs-results/types-diff.log || true
          python - <<'PY'
          import difflib, pathlib, posixpath, re, subprocess
          root = pathlib.Path('/tmp/langchainjs-results')
          base = 'aecbc7eae0befb6103ef7d90b2c603d94af0e20a'
          head = '694e96efd6ee92efc9cd0b451a05e6904683011c'
          maps = {}
          def source(ref, path):
              return subprocess.check_output(['git', 'show', f'{ref}:{path}']).decode().splitlines()
          def remap(match):
              path, line, column = match.groups()
              if path not in maps:
                  repo_path = posixpath.normpath('libs/providers/langchain-openai/' + path)
                  before, after = source(base, repo_path), source(head, repo_path)
                  maps[path] = {}
                  for block in difflib.SequenceMatcher(None, before, after, autojunk=False).get_matching_blocks():
                      maps[path].update({block.b + offset + 1: block.a + offset + 1 for offset in range(block.size)})
              assert int(line) in maps[path], f'Diagnostic on a changed source line: {path}:{line}'
              return f'{path}({maps[path][int(line)]},{column}): error TS'
          pattern = r'^([^\n(]+)\((\d+),(\d+)\): error TS'
          normalized = re.sub(pattern, remap, (root / 'types-head.log').read_text(), flags=re.M)
          (root / 'types-head-mapped.log').write_text(normalized)
          assert normalized == (root / 'types-base.log').read_text(), 'Type diagnostics differ after mapping unchanged lines'
          count = len(re.findall(pattern, normalized, re.M))
          result = f'{count} identical baseline diagnostics; all anchors map to unchanged source lines.\n'
          (root / 'types-comparison.txt').write_text(result)
          print(result)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: langchainjs-11955-linux-results
          path: /tmp/langchainjs-results
