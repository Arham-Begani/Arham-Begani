name: pnpm registry-type validation
on:
  push:
    branches: [oss-validation/pnpm-236]
    paths: [.github/workflows/pnpm-236.yml, validation/**]
permissions:
  contents: read
jobs:
  config-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pnpm/pnpm
          ref: b003905dd9ad40d9e9bacf1be635f7527eb2b907
          path: source
          persist-credentials: false
      - name: Set up Rust
        working-directory: source
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e
        with:
          version: 12.16.1
          install: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32
        with:
          tool: just,cargo-nextest,typos-cli,taplo-cli
      - name: Apply patch and install dependencies
        working-directory: source
        run: |
          git apply ../validation/pnpm-236.patch
          git add -N .
          pnpm install --frozen-lockfile
      - name: Build registry fixture binaries
        working-directory: source
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
        run: pnpm ci:build-pnpr
      - name: Rust env-installer tests
        working-directory: source
        run: pnpm test:rust -p pnpm-env-installer 2>&1 | tee ../rust-tests.log
      - name: TypeScript env-installer tests
        working-directory: source
        run: pnpm --filter @pnpm/installing.env-installer test 2>&1 | tee ../ts-tests.log
      - name: Rust config-dependency CLI tests
        working-directory: source
        run: pnpm test:rust -p pnpm-cli -E 'test(config_dependencies::)' 2>&1 | tee ../rust-cli-tests.log
      - name: TypeScript config-dependency CLI tests
        working-directory: source
        run: pnpm --filter pnpm test configurationalDependencies.test.ts 2>&1 | tee ../ts-cli-tests.log
      - name: Check workspace
        working-directory: source
        run: pnpm check:rust
      - name: Formatting and spelling
        working-directory: source
        run: |
          typos pnpm pnpr
          taplo format --check
          node pnpm/scripts/rustfmt.mjs --all
          git diff > ../formatted.patch
          node pnpm/scripts/rustfmt.mjs --all -- --check
      - name: Downstream CLI smoke tests
        working-directory: source
        run: pnpm test:rust-smoke -p pnpm-cli 2>&1 | tee ../smoke-tests.log
      - name: Install custom lint tools from source
        run: cargo +1.97.0 install cargo-dylint dylint-link --locked
      - name: Complete Rust pre-push checks
        working-directory: source
        run: pnpm pre-push:rust 2>&1 | tee ../pre-push.log
      - name: TypeScript workspace compile and lint
        working-directory: source
        run: |
          pnpm compile-only
          pnpm lint --quiet
      - name: Capture checked source
        if: always()
        working-directory: source
        run: git diff > ../formatted.patch
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-236-linux-evidence
          path: |
            rust-tests.log
            ts-tests.log
            formatted.patch
            rust-cli-tests.log
            ts-cli-tests.log
            smoke-tests.log
            pre-push.log
