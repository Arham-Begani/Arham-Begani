name: pnpm registry-type validation
on:
  push:
    branches: [oss-validation/pnpm-236]
    paths: [.github/workflows/pnpm-236.yml, validation/**]
permissions:
  contents: read
jobs:
  config-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pnpm/pnpm
          ref: b003905dd9ad40d9e9bacf1be635f7527eb2b907
          path: source
          persist-credentials: false
      - name: Set up Rust
        working-directory: source
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e
        with:
          version: 12.16.1
          install: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32
        with:
          tool: just,cargo-nextest,typos-cli,taplo-cli
      - name: Prepare baseline with test input wiring
        working-directory: source
        run: |
          git apply ../validation/pnpm-236.patch
          git restore pnpm/crates/env-installer/src/resolve_and_install_config_deps.rs pnpm/crates/env-installer/src/resolve_and_install_config_deps/plan.rs pnpm/crates/env-installer/src/resolve_optional_subdeps.rs pnpm/crates/env-installer/src/manifest_lockfile.rs pnpm/crates/env-installer/src/install_config_deps/optional_dependencies.rs pnpm/crates/env-installer/src/resolve_package_manager_integrities.rs pnpm11/installing/env-installer/src
          pnpm install --frozen-lockfile
      - name: Rust baseline must fail the round-trip assertion
        working-directory: source
        shell: bash
        run: |
          set +e
          pnpm test:rust -p pnpm-env-installer -E 'test(pnpr_config_dependencies_round_trip_without_tarball_urls)' 2>&1 | tee ../rust-baseline.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -Eq '1 tests? run: 0 passed, 1 failed' ../rust-baseline.log
      - name: TypeScript baseline must fail the round-trip assertion
        working-directory: source
        shell: bash
        run: |
          set +e
          pnpm --filter @pnpm/installing.env-installer test resolveAndInstallConfigDeps.test.ts -t 'pnpr config dependencies round trip' 2>&1 | tee ../ts-baseline.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'Expected path: not "tarball"' ../ts-baseline.log
      - name: Apply complete fix
        working-directory: source
        run: |
          git restore .
          git apply ../validation/pnpm-236.patch
          pnpm install --frozen-lockfile
      - name: Rust env-installer tests
        working-directory: source
        run: pnpm test:rust -p pnpm-env-installer 2>&1 | tee ../rust-tests.log
      - name: TypeScript env-installer tests
        working-directory: source
        run: pnpm --filter @pnpm/installing.env-installer test 2>&1 | tee ../ts-tests.log
      - name: Check workspace
        working-directory: source
        run: pnpm check:rust
      - name: Lint workspace
        working-directory: source
        run: pnpm lint:rust
      - name: Formatting and spelling
        working-directory: source
        run: |
          typos pnpm pnpr
          taplo format --check
          node pnpm/scripts/rustfmt.mjs --all
          git diff > ../formatted.patch
          node pnpm/scripts/rustfmt.mjs --all -- --check
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-236-linux-evidence
          path: |
            rust-baseline.log
            ts-baseline.log
            rust-tests.log
            ts-tests.log
            formatted.patch
