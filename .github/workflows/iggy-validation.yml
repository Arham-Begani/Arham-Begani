name: Validate prepared Iggy rebase

on:
  push:
    branches: [oss-validation/iggy-4552]
    paths:
      - .github/workflows/iggy-validation.yml
      - .github/validation/iggy-4552.bundle
      - .github/validation/prepare_iggy.py

permissions:
  contents: read

jobs:
  sdk:
    name: SDK and hooks (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ["23", "24"]
    defaults:
      run:
        shell: bash
        working-directory: iggy
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Restore and verify exact local commits
        working-directory: .
        run: python3 .github/validation/prepare_iggy.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        if: matrix.node == '24'
        with:
          enable-cache: false
      - name: Install locked SDK dependencies
        run: |
          node --version
          npm --version
          npm --prefix foreign/node ci --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/iggy-results/npm-install.log"
      - name: Install required hook tools
        if: matrix.node == '24'
        run: |
          uv tool install prek==0.5.6
          uv tool install typos==1.51.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install --prefix "$RUNNER_TEMP/hook-tools" markdownlint-cli@0.49.1
          echo "$RUNNER_TEMP/hook-tools/node_modules/.bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/hawkeye" "$RUNNER_TEMP/hook-bin"
          version=$(cat .github/config/hawkeye.version)
          archive=hawkeye-x86_64-unknown-linux-gnu.tar.xz
          cd "$RUNNER_TEMP/hawkeye"
          curl -fSL --retry 3 "https://github.com/fast/hawkeye/releases/download/v${version}/${archive}" -o "$archive"
          curl -fSL --retry 3 "https://github.com/fast/hawkeye/releases/download/v${version}/${archive}.sha256" -o "${archive}.sha256"
          sha256sum -c "${archive}.sha256"
          tar -xJf "$archive"
          find . -type f -name hawkeye -exec install -m755 {} "$RUNNER_TEMP/hook-bin/hawkeye" \;
          echo "$RUNNER_TEMP/hook-bin" >> "$GITHUB_PATH"
      - name: Run all applicable unmodified prek hooks
        id: hooks
        if: matrix.node == '24'
        run: prek run --from-ref c5709f52042477d24c0847e6035bfdcafddc32bc --to-ref HEAD 2>&1 | tee "$RUNNER_TEMP/iggy-results/prek.log"
      - name: Verify hooks did not change tested source
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = a3de19bd7923ba57931fadbe3a05b5b293ee3ada
          git diff --exit-code HEAD
          git diff HEAD --check
      - name: SDK lint and build
        if: always()
        run: |
          cd foreign/node
          npm run lint 2>&1 | tee "$RUNNER_TEMP/iggy-results/lint.log"
          npm run build 2>&1 | tee "$RUNNER_TEMP/iggy-results/build.log"
      - name: Full SDK unit suite
        if: always()
        run: |
          cd foreign/node
          npm run test:unit 2>&1 | tee "$RUNNER_TEMP/iggy-results/unit.log"
      - name: Save actual validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iggy-sdk-node-${{ matrix.node }}
          retention-days: 7
          path: ${{ runner.temp }}/iggy-results/

  server:
    name: Real server TCP, TLS and BDD
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: iggy
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Restore and verify exact local commits
        working-directory: .
        run: python3 .github/validation/prepare_iggy.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26"
      - name: Prepare Linux runtime dependencies
        run: |
          ./scripts/ci/apt-install.sh libhwloc-dev pkg-config libudev-dev netcat-openbsd
          if test -e /proc/sys/kernel/io_uring_disabled; then sudo sysctl -w kernel.io_uring_disabled=0; fi
          npm --prefix foreign/node ci --ignore-scripts
          rustup show
      - name: Build matching real server and CLI from locked source
        id: runtime
        run: cargo build --locked --bin iggy-server --bin iggy 2>&1 | tee "$RUNNER_TEMP/iggy-results/runtime-build.log"
      - name: Start real TCP server
        id: tcp
        uses: ./iggy/.github/actions/utils/server-start
        with:
          bin: ${{ github.workspace }}/iggy/target/debug/iggy-server
          working-directory: iggy
          log-file: ${{ runner.temp }}/iggy-results/server-tcp.log
          pid-file: ${{ runner.temp }}/iggy-tcp.pid
          wait-timeout-seconds: "90"
        env:
          IGGY_PATH: ${{ runner.temp }}/iggy-data-tcp
      - name: Full real-server TCP E2E suite
        run: |
          cd foreign/node
          npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/iggy-results/e2e-tcp.log"
      - name: Stop TCP server
        if: always()
        uses: ./iggy/.github/actions/utils/server-stop
        with:
          pid-file: ${{ runner.temp }}/iggy-tcp.pid
      - name: Start real TLS server
        id: tls
        if: always() && steps.runtime.outcome == 'success'
        uses: ./iggy/.github/actions/utils/server-start
        with:
          bin: ${{ github.workspace }}/iggy/target/debug/iggy-server
          working-directory: iggy
          log-file: ${{ runner.temp }}/iggy-results/server-tls.log
          pid-file: ${{ runner.temp }}/iggy-tls.pid
          wait-timeout-seconds: "90"
        env:
          IGGY_PATH: ${{ runner.temp }}/iggy-data-tls
          IGGY_TCP_TLS_ENABLED: "true"
          IGGY_TCP_TLS_CERT_FILE: core/certs/iggy_cert.pem
          IGGY_TCP_TLS_KEY_FILE: core/certs/iggy_key.pem
      - name: Real-server TLS E2E tests
        if: always() && steps.tls.outcome == 'success'
        run: |
          cd foreign/node
          IGGY_TCP_TLS_ENABLED=true IGGY_TCP_ADDRESS=127.0.0.1:8090 node --import @swc-node/register/esm-register --test src/e2e/tls.system.e2e.ts 2>&1 | tee "$RUNNER_TEMP/iggy-results/e2e-tls.log"
      - name: Stop TLS server
        if: always()
        uses: ./iggy/.github/actions/utils/server-stop
        with:
          pid-file: ${{ runner.temp }}/iggy-tls.pid
      - name: Start clean real server for BDD
        id: bdd
        if: always() && steps.runtime.outcome == 'success'
        uses: ./iggy/.github/actions/utils/server-start
        with:
          bin: ${{ github.workspace }}/iggy/target/debug/iggy-server
          working-directory: iggy
          log-file: ${{ runner.temp }}/iggy-results/server-bdd.log
          pid-file: ${{ runner.temp }}/iggy-bdd.pid
          wait-timeout-seconds: "90"
        env:
          IGGY_PATH: ${{ runner.temp }}/iggy-data-bdd
      - name: All upstream-supported Node BDD scenarios against real server
        if: always() && steps.bdd.outcome == 'success'
        run: |
          cd foreign/node
          # bdd/node/Dockerfile copies only these two implemented feature sets.
          IGGY_TCP_ADDRESS=127.0.0.1:8090 IGGY_ROOT_USERNAME=iggy IGGY_ROOT_PASSWORD=iggy npm run test:bdd -- --tags '@basic-messaging or @raw-command' 2>&1 | tee "$RUNNER_TEMP/iggy-results/bdd.log"
      - name: Stop BDD server
        if: always()
        uses: ./iggy/.github/actions/utils/server-stop
        with:
          pid-file: ${{ runner.temp }}/iggy-bdd.pid
      - name: Verify final tested source
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = a3de19bd7923ba57931fadbe3a05b5b293ee3ada
          git diff --exit-code HEAD
      - name: Save actual server and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iggy-real-server-validation
          retention-days: 7
          path: ${{ runner.temp }}/iggy-results/
