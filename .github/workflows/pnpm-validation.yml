name: pnpm contribution validation
on:
  push:
    branches: [oss-validation/pnpm-231-236]
    paths: [.github/workflows/pnpm-validation.yml, validation/**]
permissions:
  contents: read
jobs:
  store-aliases:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pnpm/pnpm
          ref: b003905dd9ad40d9e9bacf1be635f7527eb2b907
          path: source
          persist-credentials: false
      - name: Set up Rust
        working-directory: source
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e
        with:
          version: 12.16.1
          install: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32
        with:
          tool: just,cargo-nextest,typos-cli,taplo-cli
      - name: Install dependencies and apply final patch
        working-directory: source
        run: |
          git apply ../validation/pnpm-231-impl.patch
          git add -N .
          pnpm install --frozen-lockfile
      - name: Affected crate and downstream smoke tests
        working-directory: source
        run: pnpm test:rust-affected --base HEAD 2>&1 | tee ../affected-tests.log
      - name: Store CLI tests
        working-directory: source
        run: pnpm test:rust -p pnpm-cli -E 'test(store::) | test(store_prune_in_use::)' 2>&1 | tee ../cli-tests.log
      - name: Install custom lint tools from source
        run: cargo +1.97.0 install cargo-dylint dylint-link --locked
      - name: Complete Rust pre-push checks
        working-directory: source
        run: pnpm pre-push:rust 2>&1 | tee ../pre-push.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-231-final-linux-evidence
          path: |
            affected-tests.log
            cli-tests.log
            pre-push.log
