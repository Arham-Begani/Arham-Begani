name: Iggy public listener regression baseline
on:
  push:
    branches: [oss-validation/iggy-listener-nov5]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: receipts
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: apache/iggy
          ref: 4f0b105e9420010ebcc90cf246a231da10b2a53b
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Apply only the regression tests to unchanged production
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4f0b105e9420010ebcc90cf246a231da10b2a53b
          test -z "$(git status --porcelain)"
          printf '%s  %s\n' 'e5703cd1ff305b328101cb3b9ae247bcaf861fd6de2e9d6a0d4bfb78fbc49d88' '../receipts/validation/iggy-listener-regression-nov5.patch' | sha256sum --check
          git apply --check ../receipts/validation/iggy-listener-regression-nov5.patch
          git apply ../receipts/validation/iggy-listener-regression-nov5.patch
          test "$(git diff --name-only)" = foreign/node/src/client/client.test.ts
          git diff --exit-code -- . ':(exclude)foreign/node/src/client/client.test.ts'
          mkdir -p "$GITHUB_WORKSPACE/logs"
      - name: Install locked Node dependencies
        working-directory: source/foreign/node
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ci --no-audit --no-fund 2>&1 | tee "$GITHUB_WORKSPACE/logs/npm-ci.log"
          git diff --exit-code -- package-lock.json
      - name: Verify two actual swallowed-listener regressions and the lifetime control
        working-directory: source/foreign/node
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --import @swc-node/register/esm-register --test --test-reporter=tap --test-name-pattern='error listener exceptions|queued connection error' ./src/client/client.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/logs/listener-baseline.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -Fx '# tests 3' "$GITHUB_WORKSPACE/logs/listener-baseline.log"
          grep -Fx '# pass 1' "$GITHUB_WORKSPACE/logs/listener-baseline.log"
          grep -Fx '# fail 2' "$GITHUB_WORKSPACE/logs/listener-baseline.log"
          test "$(grep -Ec 'actual: 5$' "$GITHUB_WORKSPACE/logs/listener-baseline.log")" -eq 2
          if grep -q 'ETIMEDOUT\|ERR_MODULE_NOT_FOUND' "$GITHUB_WORKSPACE/logs/listener-baseline.log"; then
            exit 1
          fi
          git diff --exit-code -- src/client/client.socket.ts package-lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iggy-listener-baseline-nov5
          path: logs/
