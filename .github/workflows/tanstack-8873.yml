name: TanStack reconciliation fix validation
on:
  push:
    branches: [oss-validation/tanstack-8873]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          path: receipts
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: TanStack/query
          ref: f69b28a1dd2a2b4ca9b8f9117e0f60cc70443775
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Install pinned package manager
        run: npm install --global pnpm@12.4.2
      - name: Install scoped dependencies with repository policies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Apply regression tests only
        working-directory: source
        run: git apply ../receipts/validation/tanstack-8873-fix.patch
      - name: Run Solid Query suite and package checks
        working-directory: source
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
        run: |
          set -o pipefail
          pnpm nx run '@tanstack/solid-query:test:lib' --output-style=static 2>&1 | tee ../suite.log
          pnpm nx run '@tanstack/solid-query:test:types' --output-style=static 2>&1 | tee ../types.log
          pnpm nx run '@tanstack/solid-query:test:oxlint' --output-style=static 2>&1 | tee ../lint.log
          pnpm nx run '@tanstack/solid-query:build' --output-style=static 2>&1 | tee ../build.log
          pnpm exec eslint packages/solid-query/src/useBaseQuery.ts packages/solid-query/src/__tests__/useQuery.test.tsx
          pnpm exec oxfmt --check packages/solid-query/src/useBaseQuery.ts packages/solid-query/src/__tests__/useQuery.test.tsx
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tanstack-8873-validation
          path: '*.log'
